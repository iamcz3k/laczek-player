name: Build LaCzek Player APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: laczek-player-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android SDK
        run: sdkmanager --list_installed
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package, signature, and offline-only permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.v3x.laczekplayer'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "Offline-only APK must not request INTERNET permission (including merged manifest)" >&2
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/debug/LACZEKPlayer-1.8.0.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LACZEKPlayer-1.8.0-debug
          path: app/build/outputs/apk/debug/LACZEKPlayer-1.8.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish easy-download GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: LaCzek Player Latest Test Build
          make_latest: true
          files: app/build/outputs/apk/debug/LACZEKPlayer-1.8.0.apk
          overwrite_files: true
          fail_on_unmatched_files: true
