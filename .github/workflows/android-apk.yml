name: Build LaCzek Player APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: laczek-player-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android SDK
        run: sdkmanager --list_installed
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package, signature, and offline-only permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.v3x.laczekplayer'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "application-icon(-[0-9]+)?:"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "Offline-only APK must not request INTERNET permission (including merged manifest)" >&2
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/debug/LACZEKPlayer-2.8.0.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LACZEKPlayer-2.8.0-debug
          path: app/build/outputs/apk/debug/LACZEKPlayer-2.8.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish easy-download GitHub Release APK
        if: github.ref == 'refs/heads/telegram-football-bot'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.0
          name: LaCzek Player v2.8.0
          make_latest: true
          files: app/build/outputs/apk/debug/LACZEKPlayer-2.8.0.apk
          overwrite_files: true
          body: |
            LaCzek Player v2.8.0 — full violet AMOLED UI refresh, single-AirPod branding, local video playback, on-device MP4-to-MP3 conversion, and M4A audio extraction.

            - Rebuilt violet AMOLED interface with compact navigation, redesigned controls, gradient surfaces, and LaCzek-white / Player-violet identity with a single-AirPod icon.
            - Local video library with search, Media3 playback controls, speed adjustment, rotation, file details and sharing. Convert MP4 audio to MP3 locally or extract compatible source audio to M4A.
            - Minimum file size and duration filters, stored locally and applied to library views.
            - Expanded offline sorting by year, file size, rating, play count, format and duration.
            - Search local saved lyrics along with track metadata.
            - Extract featured artists from local artist metadata and browse them separately.
            - Read folder cover.jpg/cover.png and .info.txt after the user grants local folder access.
            - Manually reorder playlist tracks and assign local playlist artwork.
            - Preserve multi-selection across library sections and select whole groups.
            - Media3 native skip-silence playback with a local toggle.
            - Smooth fade effects around play, pause and track skip.
            - Optional mini-player breathing-edge party animation.
            - Local backup/restore includes new playlist artwork and library filter settings.
            - No internet permission. APK verification checks package ID, archive integrity, debug signature, launcher icon, and offline-only permissions.
            - Debug APK for device testing.
          fail_on_unmatched_files: true
      - name: Publish build status on commit
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const result = process.env.JOB_STATUS;
            const state = result === "success" ? "success" : result === "cancelled" ? "error" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "LaCzek Player / APK verification",
              description: state === "success" ? "APK, offline permissions, signature, package ID, and launcher icon verified" : `Build workflow ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
