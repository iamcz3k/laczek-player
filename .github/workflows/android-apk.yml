name: Build LaCzek Player APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: laczek-player-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android SDK
        run: sdkmanager --list_installed
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LACZEKPlayer-1.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish easy-download GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: LaCzek Player Latest Test Build
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
